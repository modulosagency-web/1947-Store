<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>404 Not Found</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
:root {
  --red:#d32f2f; --red-dark:#b71c1c; --green:#25D366; --green-dark:#128C7E;
  --dark:#1a1a1a; --gray:#666; --light-gray:#f7f7f7; --border:#e5e5e5;
}
body { background:var(--light-gray); color:#333; line-height:1.6; font-size:15px; min-height:100vh; }
button { font-family:inherit; cursor:pointer; }
img { max-width:100%; display:block; }

.login-wrap {
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  background:linear-gradient(135deg,#1a1a1a 0%,#2a1010 100%);
}
.login-box {
  width:100%; max-width:420px; background:#fff; padding:40px 35px; border-radius:16px;
  box-shadow:0 25px 80px rgba(0,0,0,0.4);
}
.login-icon {
  width:70px; height:70px; margin:0 auto 20px;
  background:linear-gradient(135deg,var(--red),var(--red-dark)); border-radius:18px;
  display:flex; align-items:center; justify-content:center; font-size:28px; color:#fff;
  box-shadow:0 10px 30px rgba(211,47,47,0.35);
}
.login-title { text-align:center; font-size:23px; font-weight:800; color:var(--dark); margin-bottom:6px; }
.login-subtitle { text-align:center; color:var(--gray); font-size:13px; margin-bottom:26px; }

.alert { padding:12px 16px; border-radius:8px; font-size:13px; margin-bottom:14px; display:none; align-items:center; gap:8px; }
.alert.show { display:flex; }
.alert-error { background:#fee2e2; color:#991b1b; }
.alert-success { background:#dcfce7; color:#166534; }
.alert-warning { background:#fef3c7; color:#92400e; }
.alert-info { background:#dbeafe; color:#1e40af; }

.field { position:relative; margin-bottom:14px; }
.field-icon { position:absolute; left:16px; top:50%; transform:translateY(-50%); color:#999; font-size:14px; }
.field input {
  width:100%; padding:14px 16px 14px 46px; background:var(--light-gray);
  border:1px solid var(--border); border-radius:8px; color:var(--dark); font-size:15px;
  outline:none; transition:all 0.2s;
}
.field input:focus { border-color:var(--red); background:#fff; box-shadow:0 0 0 3px rgba(211,47,47,0.1); }

.btn-primary {
  width:100%; padding:14px 24px; background:var(--red); color:#fff; border:none;
  border-radius:8px; font-size:15px; font-weight:700;
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
  transition:background 0.2s;
}
.btn-primary:hover:not(:disabled) { background:var(--red-dark); }
.btn-primary:disabled { opacity:0.6; cursor:not-allowed; }
.btn-green { background:var(--green); }
.btn-green:hover:not(:disabled) { background:var(--green-dark); }

.panel-wrap { display:none; }
.panel-wrap.active { display:block; }
.topbar {
  background:#fff; border-bottom:1px solid var(--border); padding:16px 24px;
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:50;
}
.brand { display:flex; align-items:center; gap:10px; font-size:18px; font-weight:800; color:var(--dark); }
.brand-badge {
  background:var(--red); color:#fff; padding:4px 10px; border-radius:5px;
  font-size:13px; letter-spacing:1px; font-weight:900;
}
.btn-logout {
  padding:9px 16px; background:#ef4444; color:#fff; border:none; border-radius:6px;
  font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px;
}
.btn-logout:hover { background:#b91c1c; }

.container { max-width:1100px; margin:0 auto; padding:24px 20px 60px; }
.section {
  background:#fff; border:1px solid var(--border); border-radius:12px;
  padding:26px; margin-bottom:20px;
}
.section-title {
  display:flex; align-items:center; gap:10px; font-size:17px; font-weight:800;
  color:var(--dark); margin-bottom:20px; padding-bottom:14px; border-bottom:1px solid var(--border);
}
.section-title i {
  width:34px; height:34px; background:rgba(211,47,47,0.1); color:var(--red);
  border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:15px;
}

.form-group { margin-bottom:16px; }
.form-label {
  display:block; font-size:12px; font-weight:700; color:var(--gray);
  margin-bottom:7px; text-transform:uppercase; letter-spacing:0.5px;
}
.form-input, .form-textarea {
  width:100%; padding:12px 14px; background:#fff; border:1px solid var(--border);
  border-radius:8px; color:var(--dark); font-size:14px; font-family:inherit;
  outline:none; transition:all 0.2s;
}
.form-textarea { resize:vertical; min-height:90px; }
.form-input:focus, .form-textarea:focus {
  border-color:var(--red); box-shadow:0 0 0 3px rgba(211,47,47,0.1);
}

.row-2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:600px) { .row-2 { grid-template-columns:1fr; } }

.help-text {
  font-size:12px; color:#999; margin-top:5px;
  display:flex; align-items:flex-start; gap:5px; line-height:1.5;
}

.upload-zone {
  border:2px dashed var(--border); border-radius:10px; padding:30px 20px;
  text-align:center; background:var(--light-gray); cursor:pointer;
  transition:all 0.2s; position:relative;
}
.upload-zone:hover, .upload-zone.dragging {
  border-color:var(--red); background:rgba(211,47,47,0.03);
}
.upload-zone input[type="file"] {
  position:absolute; inset:0; opacity:0; cursor:pointer;
}
.upload-zone i { font-size:34px; color:var(--red); margin-bottom:10px; }
.upload-zone h4 { font-size:15px; font-weight:700; color:var(--dark); margin-bottom:4px; }
.upload-zone p { font-size:12px; color:var(--gray); }

.preview-grid {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  gap:12px; margin-top:16px;
}
.preview-item {
  position:relative; aspect-ratio:1/1; border-radius:8px; overflow:hidden;
  border:1px solid var(--border); background:var(--light-gray);
}
.preview-item img { width:100%; height:100%; object-fit:cover; }
.preview-item .remove {
  position:absolute; top:5px; right:5px; width:24px; height:24px;
  background:rgba(239,68,68,0.9); color:#fff; border:none; border-radius:50%;
  font-size:11px; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.preview-item .remove:hover { background:#b91c1c; }
.preview-item .primary-tag {
  position:absolute; bottom:5px; left:5px; background:var(--green);
  color:#fff; font-size:10px; font-weight:700; padding:2px 6px; border-radius:3px;
}
.preview-item .upload-status {
  position:absolute; inset:0; background:rgba(0,0,0,0.7); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:20px;
}

.progress-wrap { margin-top:15px; display:none; }
.progress-wrap.show { display:block; }
.progress-bar {
  width:100%; height:8px; background:var(--light-gray); border-radius:4px;
  overflow:hidden; margin-bottom:8px;
}
.progress-fill {
  height:100%; background:linear-gradient(90deg,var(--red),#f44336);
  width:0%; transition:width 0.3s ease;
}
.progress-text { font-size:12px; color:var(--gray); text-align:center; font-weight:600; }

.product-row {
  display:flex; align-items:center; gap:14px; padding:12px;
  background:var(--light-gray); border-radius:10px; margin-bottom:10px;
}
.product-row-thumbs { display:flex; gap:4px; flex-shrink:0; }
.product-row-thumbs img {
  width:46px; height:46px; object-fit:cover; border-radius:6px; border:1px solid var(--border);
}
.product-row-thumbs .thumb-count {
  width:46px; height:46px; background:var(--dark); color:#fff; border-radius:6px;
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;
}
.product-row-info { flex:1; min-width:0; }
.product-row-info h4 {
  font-size:14px; font-weight:700; color:var(--dark);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:3px;
}
.product-row-info p { font-size:12px; color:var(--gray); }
.btn-delete {
  padding:8px 12px; background:#ef4444; color:#fff; border:none; border-radius:6px;
  font-size:12px; font-weight:600; display:inline-flex; align-items:center; gap:5px;
}
.btn-delete:hover { background:#b91c1c; }

.empty-state { text-align:center; padding:50px 20px; color:var(--gray); }
.empty-state i { font-size:46px; color:#ddd; margin-bottom:12px; display:block; }
.empty-state p { font-size:14px; }

.badge {
  display:inline-flex; align-items:center; gap:4px; padding:3px 10px;
  border-radius:20px; font-size:11px; font-weight:700;
}
.badge-red { background:rgba(211,47,47,0.1); color:var(--red); }

@media (max-width:600px) {
  .container { padding:16px 12px 40px; }
  .section { padding:20px; }
  .login-box { padding:32px 24px; }
  .upload-zone { padding:24px 16px; }
  .preview-grid { grid-template-columns:repeat(auto-fill,minmax(85px,1fr)); }
}
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="login-icon"><i class="fa-solid fa-shield-halved"></i></div>
    <h1 class="login-title">Admin Access</h1>
    <p class="login-subtitle">1947 Clothing Store</p>

    <div class="alert alert-error" id="loginError">
      <i class="fa-solid fa-circle-exclamation"></i><span id="loginErrorText"></span>
    </div>
    <div class="alert alert-warning" id="loginLock">
      <i class="fa-solid fa-lock"></i><span id="loginLockText"></span>
    </div>

    <div class="field">
      <input type="text" id="adminUser" placeholder="Username" autocomplete="off">
      <i class="fa-solid fa-user field-icon"></i>
    </div>
    <div class="field">
      <input type="password" id="adminPass" placeholder="Password" autocomplete="off"
             onkeypress="if(event.key==='Enter')login()">
      <i class="fa-solid fa-lock field-icon"></i>
    </div>

    <button class="btn-primary" id="loginBtn" onclick="login()">
      <i class="fa-solid fa-right-to-bracket"></i><span>Sign In</span>
    </button>
  </div>
</div>

<div class="panel-wrap" id="panelWrap">
  <div class="topbar">
    <div class="brand">
      <span class="brand-badge">1947</span>
      <span>Admin</span>
    </div>
    <button class="btn-logout" onclick="logout()">
      <i class="fa-solid fa-right-from-bracket"></i><span>Logout</span>
    </button>
  </div>

  <div class="container">

    <div class="section">
      <div class="section-title">
        <i class="fa-brands fa-github"></i><span>GitHub Settings</span>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="ghUser" class="form-input" placeholder="modulosagency-web">
        </div>
        <div class="form-group">
          <label class="form-label">Repository</label>
          <input type="text" id="ghRepo" class="form-input" placeholder="e-commerce">
        </div>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label class="form-label">Branch</label>
          <input type="text" id="ghBranch" class="form-input" value="main">
        </div>
        <div class="form-group">
          <label class="form-label">Personal Access Token</label>
          <input type="password" id="ghToken" class="form-input" placeholder="github_pat_...">
        </div>
      </div>

      <p class="help-text">
        <i class="fa-solid fa-circle-info"></i>
        Token sirf browser me save hota hai. Server pe kabhi nahi jata.
      </p>

      <button class="btn-primary" style="margin-top:12px;" onclick="saveSettings()">
        <i class="fa-solid fa-floppy-disk"></i><span>Save Settings</span>
      </button>
    </div>

    <div class="section">
      <div class="section-title">
        <i class="fa-solid fa-plus"></i><span>Add New Product</span>
      </div>

      <div class="alert" id="status">
        <i id="statusIcon" class="fa-solid fa-circle-info"></i>
        <span id="statusText"></span>
      </div>

      <div class="form-group">
        <label class="form-label">Product Title *</label>
        <input type="text" id="pName" class="form-input" placeholder="e.g. Classic Denim Jacket">
      </div>

      <div class="form-group">
        <label class="form-label">Description *</label>
        <textarea id="pDesc" class="form-textarea" placeholder="Premium quality fabric, perfect fit..."></textarea>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label class="form-label">Selling Price (₹) *</label>
          <input type="number" id="pPrice" class="form-input" placeholder="1499">
        </div>
        <div class="form-group">
          <label class="form-label">Old Price (₹)</label>
          <input type="number" id="pOldPrice" class="form-input" placeholder="2499">

      <div class="form-group">

      <div class="form-group">
        <label class="form-label">
          Product Photos *
          <span style="color:var(--gray);font-weight:400;text-transform:none;">(Multiple select karo)</span>
        </label>

        <div class="upload-zone" id="uploadZone">
          <input type="file" id="photoInput" accept="image/*" multiple>
          <i class="fa-solid fa-cloud-arrow-up"></i>

        Pehli photo "MAIN" hogi. Baaki gallery me dikhengi.

      <button class="btn-primary btn-green" id="publishBtn" style="margin-top:16px;" onclick="addProduct()">
        <i class="fa-solid fa-cloud-arrow-up"></i><span>Publish Product</span>

      <div class="progress-wrap" id="progressWrap">

    <div class="section">

        <span class="badge badge-red" id="prodCount" style="margin-left:auto;">0</span>
      </div>
      <div id="productList"></div>
    </div>

  </div>
</div>

<script>
/* ═══ CONFIG ═══ */
const _u = "admin";
const _p = "1947@store";
const MAX_ATTEMPTS = 3;
const LOCK_TIME = 5 * 60 * 1000;
const SESSION_TIME = 30 * 60 * 1000;
const STORAGE_KEY = 'adminSession_v5';
const PRODUCTS_FILE_PATH = 'js/products.js';
const IMAGES_FOLDER = 'images';
const WHATSAPP_NUMBER = "919999999999";  // ← APNA NUMBER YAHAN DAALO

let settings = JSON.parse(localStorage.getItem('ghSettings') || '{}');
let productsData = [];
let selectedPhotos = [];

/* ═══ AUTH ═══ */
async function sha256(text) {
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function isLoggedIn() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (!s.expires || Date.now() > s.expires) { localStorage.removeItem(STORAGE_KEY); return false; }
    return s.auth === true;
  } catch { return false; }
}

function getAttempts() { return parseInt(localStorage.getItem('adminAtt_v5') || '0'); }
function getLockUntil() { return parseInt(localStorage.getItem('adminLock_v5') || '0'); }

function showAlertBox(id, textId, msg) {
  const el = document.getElementById(id);
  if (textId) document.getElementById(textId).textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 5000);
}

async function login() {
  const user = document.getElementById('adminUser').value.trim();
  const pass = document.getElementById('adminPass').value;
  const btn = document.getElementById('loginBtn');

  const lockUntil = getLockUntil();
  if (lockUntil > Date.now()) {
    const mins = Math.ceil((lockUntil - Date.now()) / 60000);
    showAlertBox('loginLock', 'loginLockText', `Locked. Try again in ${mins} min.`);
    return;
  }

  if (!user || !pass) {
    showAlertBox('loginError', 'loginErrorText', 'Username aur password daalo.');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Verifying...</span>';

  const inputHash = await sha256(user + ':' + pass);
  const expectedHash = await sha256(_u + ':' + _p);

  if (inputHash === expectedHash) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      auth: true, expires: Date.now() + SESSION_TIME
    }));
    localStorage.removeItem('adminAtt_v5');
    localStorage.removeItem('adminLock_v5');
    showPanel();
  } else {
    const attempts = getAttempts() + 1;
    localStorage.setItem('adminAtt_v5', attempts);
    if (attempts >= MAX_ATTEMPTS) {
      localStorage.setItem('adminLock_v5', Date.now() + LOCK_TIME);
      localStorage.removeItem('adminAtt_v5');
      showAlertBox('loginLock', 'loginLockText', `${MAX_ATTEMPTS} galat attempts. 5 min lock.`);
    } else {
      showAlertBox('loginError', 'loginErrorText', `Galat! ${MAX_ATTEMPTS - attempts} attempts bache.`);
    }
    document.getElementById('adminPass').value = '';
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i><span>Sign In</span>';
  }
}

function logout() {
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}

function showPanel() {
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('panelWrap').classList.add('active');
  loadSettings();
  loadProducts();
  setTimeout(() => {
    if (!isLoggedIn()) return;
    alert('Session expired.');
    logout();
  }, SESSION_TIME);
}

/* ═══ SETTINGS ═══ */
function saveSettings() {
  settings = {
    user: document.getElementById('ghUser').value.trim(),
    repo: document.getElementById('ghRepo').value.trim(),
    branch: document.getElementById('ghBranch').value.trim() || 'main',
    token: document.getElementById('ghToken').value.trim()
  };
  if (!settings.user || !settings.repo || !settings.token) {
    showStatus('error', 'Saare GitHub fields bharein!');
    return;
  }
  localStorage.setItem('ghSettings', JSON.stringify(settings));
  showStatus('success', 'Settings saved!');
  loadProducts();
}

function loadSettings() {
  if (settings.user) document.getElementById('ghUser').value = settings.user;
  if (settings.repo) document.getElementById('ghRepo').value = settings.repo;
  if (settings.branch) document.getElementById('ghBranch').value = settings.branch;
  if (settings.token) document.getElementById('ghToken').value = settings.token;
}

/* ═══ PHOTO UPLOAD UI ═══ */
document.getElementById('photoInput').addEventListener('change', handleFiles);

const uploadZone = document.getElementById('uploadZone');
['dragenter', 'dragover'].forEach(ev => {
  uploadZone.addEventListener(ev, e => { e.preventDefault(); uploadZone.classList.add('dragging'); });
});
['dragleave', 'drop'].forEach(ev => {
  uploadZone.addEventListener(ev, e => { e.preventDefault(); uploadZone.classList.remove('dragging'); });
});
uploadZone.addEventListener('drop', e => {
  handleFiles({ target: { files: e.dataTransfer.files } });
});

function handleFiles(e) {
  const files = Array.from(e.target.files);
  const validTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/jpg', 'image/gif'];

  files.forEach(file => {
    if (!validTypes.includes(file.type)) { alert(`"${file.name}" is not a valid image.`); return; }
    if (file.size > 5 * 1024 * 1024) { alert(`"${file.name}" > 5MB.`); return; }

    const reader = new FileReader();
    reader.onload = ev => {
      selectedPhotos.push({
        file,
        dataUrl: ev.target.result,
        name: file.name,
        uploaded: false,
        url: null
      });
      renderPreview();
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
}

function renderPreview() {
  const grid = document.getElementById('previewGrid');
  if (selectedPhotos.length === 0) { grid.innerHTML = ''; return; }

  grid.innerHTML = selectedPhotos.map((p, i) => `
    <div class="preview-item">
      <img src="${p.dataUrl}" alt="">
      ${i === 0 ? '<span class="primary-tag">MAIN</span>' : ''}
      ${p.uploaded ? '<div class="upload-status"><i class="fa-solid fa-circle-check" style="color:#10b981;"></i></div>' : ''}
      <button class="remove" onclick="removePhoto(${i})">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  `).join('');
}

function removePhoto(i) {
  selectedPhotos.splice(i, 1);
  renderPreview();
}

/* ═══ GITHUB API ═══ */
function ghHeaders() {
  return {
    'Authorization': `token ${settings.token}`,
    'Accept': 'application/vnd.github.v3+json',
    'Content-Type': 'application/json'
  };
}

function apiBase() {
  return `https://api.github.com/repos/${settings.user}/${settings.repo}/contents`;
}

async function getFileSHA(path) {
  try {
    const url = `${apiBase()}/${path}?ref=${settings.branch}&t=${Date.now()}`;
    const res = await fetch(url, { headers: ghHeaders() });
    if (!res.ok) return null;
    const data = await res.json();
    return data.sha;
  } catch { return null; }
}

async function uploadFileToGitHub(path, base64Content, message, sha = null) {
  const body = { message, content: base64Content, branch: settings.branch };
  if (sha) body.sha = sha;

  const res = await fetch(`${apiBase()}/${path}`, {
    method: 'PUT',
    headers: ghHeaders(),
    body: JSON.stringify(body)
  });

  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.message || 'GitHub upload failed');
  }
  return await res.json();
}

/* Image compress */
function compressImage(file, maxWidth = 800, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let { width, height } = img;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function dataUrlToBase64(dataUrl) {
  return dataUrl.split(',')[1];
}

/* ═══ LOAD PRODUCTS ═══ */
async function loadProducts() {
  if (!settings.user || !settings.repo || !settings.token) {
    if (window.PRODUCTS_DATA) {
      productsData = window.PRODUCTS_DATA;
      renderProductList();
    }
    return;
  }
  try {
    const url = `${apiBase()}/${PRODUCTS_FILE_PATH}?ref=${settings.branch}&t=${Date.now()}`;
    const res = await fetch(url, { headers: ghHeaders() });
    if (!res.ok) return;
    const data = await res.json();
    const content = decodeURIComponent(escape(atob(data.content)));
    const match = content.match(/window\.PRODUCTS_DATA\s*=\s*(\[[\s\S]*?\]);/);
    if (match) productsData = JSON.parse(match[1]);
    renderProductList();
  } catch (e) { console.warn(e); }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[m]);
}

function renderProductList() {
  const box = document.getElementById('productList');
  document.getElementById('prodCount').textContent = productsData.length;

  if (productsData.length === 0) {
    box.innerHTML = `
      <div class="empty-state">
        <i class="fa-solid fa-box-open"></i>
        <p>Koi product nahi. Upar form se add karo!</p>
      </div>`;
    return;
  }

  box.innerHTML = productsData.map(p => {
    const imgs = (p.images && p.images.length) ? p.images : [p.image].filter(Boolean);
    const thumbs = imgs.slice(0, 2).map(src =>
      `<img src="${escapeHtml(src)}" alt="">`
    ).join('');
    const extra = imgs.length > 2 ? `<div class="thumb-count">+${imgs.length - 2}</div>` : '';

    return `
      <div class="product-row">
        <div class="product-row-thumbs">${thumbs}${extra}</div>
        <div class="product-row-info">
          <h4>${escapeHtml(p.name)}</h4>
          <p>₹${p.price} ${p.oldPrice ? `<s>₹${p.oldPrice}</s>` : ''} • ${escapeHtml(p.category || 'General')}</p>
        </div>
        <button class="btn-delete" onclick="deleteProduct(${p.id})">
          <i class="fa-solid fa-trash"></i><span>Delete</span>
        </button>
      </div>
    `;
  }).join('');
}

/* ═══ STATUS + PROGRESS ═══ */
function showStatus(type, msg) {
  const iconMap = {
    'error': 'fa-circle-exclamation',
    'success': 'fa-circle-check',
    'warning': 'fa-triangle-exclamation',
    'info': 'fa-circle-info',
    'loading': 'fa-spinner fa-spin'
  };
  document.getElementById('statusIcon').className = 'fa-solid ' + (iconMap[type] || 'fa-circle-info');
  const el = document.getElementById('status');
  el.className = 'alert alert-' + (type === 'loading' ? 'info' : type);
  el.classList.add('show');
  document.getElementById('statusText').textContent = msg;
  if (type !== 'loading') setTimeout(() => el.classList.remove('show'), 6000);
}

function setProgress(percent, text) {
  const wrap = document.getElementById('progressWrap');
  const fill = document.getElementById('progressFill');
  const txt = document.getElementById('progressText');
  if (percent === 0) { wrap.classList.remove('show'); return; }
  wrap.classList.add('show');
  fill.style.width = percent + '%';
  txt.textContent = text;
}

/* ═══ ADD PRODUCT (MAIN FLOW) ═══ */
async function addProduct() {
  const name = document.getElementById('pName').value.trim();
  const desc = document.getElementById('pDesc').value.trim();
  const price = parseInt(document.getElementById('pPrice').value);
  const oldPrice = parseInt(document.getElementById('pOldPrice').value) || 0;
  const category = document.getElementById('pCategory').value.trim() || 'Clothing';

  if (!name || !desc || !price) {
    showStatus('error', 'Title, Description aur Price required hain!');
    return;
  }
  if (selectedPhotos.length === 0) {
    showStatus('error', 'Kam se kam 1 photo upload karo!');
    return;
  }
  if (!settings.user || !settings.repo || !settings.token) {
    showStatus('error', 'Pehle GitHub settings save karo!');
    return;
  }

  const btn = document.getElementById('publishBtn');
  btn.disabled = true;

  // Unique product ID
  const productId = Date.now();
  const totalSteps = selectedPhotos.length + 1; // photos + products.js
  let doneSteps = 0;

  try {
    // STEP 1: Upload each photo
    const photoUrls = [];

    for (let i = 0; i < selectedPhotos.length; i++) {
      const photo = selectedPhotos[i];
      showStatus('loading', `Photo ${i + 1}/${selectedPhotos.length} upload ho raha hai...`);

      // Compress
      const compressedDataUrl = await compressImage(photo.file, 800, 0.82);
      const base64 = dataUrlToBase64(compressedDataUrl);

      // File path in GitHub
      const fileName = `p${productId}_${i + 1}.jpg`;
      const filePath = `${IMAGES_FOLDER}/${fileName}`;

      // Upload
      await uploadFileToGitHub(
        filePath,
        base64,
        `Upload ${fileName} for product: ${name}`
      );

      // Public URL (raw.githubusercontent.com)
      const rawUrl = `https://raw.githubusercontent.com/${settings.user}/${settings.repo}/${settings.branch}/${filePath}`;
      photoUrls.push(rawUrl);

      selectedPhotos[i].uploaded = true;
      renderPreview();

      doneSteps++;
      setProgress((doneSteps / totalSteps) * 100, `Photo ${i + 1}/${selectedPhotos.length} uploaded`);
    }

    // STEP 2: Add product to products.js
    showStatus('loading', 'Product details update ho rahi hain...');

    const newProduct = {
      id: productId,
      name,
      description: desc,
      price,
      oldPrice,
      category,
      image: photoUrls[0],        // Main image
      images: photoUrls,           // All images
      date: new Date().toISOString()
    };

    // Add new product at top
    const updatedProducts = [newProduct, ...productsData];

    // Build new products.js file
    const fileContent =
`// ⚠️ Auto-generated by admin panel
// Last update: ${new Date().toISOString()}

const WHATSAPP_NUMBER = "${WHATSAPP_NUMBER}";

window.PRODUCTS_DATA = ${JSON.stringify(updatedProducts, null, 2)};

const products = window.PRODUCTS_DATA;
`;

    const encoded = btoa(unescape(encodeURIComponent(fileContent)));
    const existingSHA = await getFileSHA(PRODUCTS_FILE_PATH);

    await uploadFileToGitHub(
      PRODUCTS_FILE_PATH,
      encoded,
      `Add product: ${name} (ID: ${productId})`,
      existingSHA
    );

    doneSteps++;
    setProgress(100, 'Done!');

    // Update local data
    productsData = updatedProducts;
    renderProductList();

    showStatus('success', `Product "${name}" successfully live ho gaya! 1-2 min me website pe ayega.`);

    // Reset form
    document.getElementById('pName').value = '';
    document.getElementById('pDesc').value = '';
    document.getElementById('pPrice').value = '';
    document.getElementById('pOldPrice').value = '';
    selectedPhotos = [];
    renderPreview();

    setTimeout(() => setProgress(0), 3000);

  } catch (e) {
    console.error(e);
    showStatus('error', 'Upload fail: ' + e.message);
    setProgress(0);
  } finally {
    btn.disabled = false;
  }
}

/* ═══ DELETE PRODUCT ═══ */
async function deleteProduct(id) {
  if (!confirm('Ye product delete karna hai? (Photos GitHub pe rahengi)')) return;

  const updated = productsData.filter(p => p.id !== id);
  if (updated.length === productsData.length) return;

  try {
    showStatus('loading', 'Delete ho raha hai...');

    const fileContent =
`// ⚠️ Auto-generated by admin panel
// Last update: ${new Date().toISOString()}

const WHATSAPP_NUMBER = "${WHATSAPP_NUMBER}";

window.PRODUCTS_DATA = ${JSON.stringify(updated, null, 2)};

const products = window.PRODUCTS_DATA;
`;

    const encoded = btoa(unescape(encodeURIComponent(fileContent)));
    const existingSHA = await getFileSHA(PRODUCTS_FILE_PATH);

    await uploadFileToGitHub(
      PRODUCTS_FILE_PATH,
      encoded,
      `Delete product ID: ${id}`,
      existingSHA
    );

    productsData = updated;
    renderProductList();
    showStatus('success', 'Product delete ho gaya!');
  } catch (e) {
    showStatus('error', 'Delete fail: ' + e.message);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  if (isLoggedIn()) {
    showPanel();
  } else {
    const lockUntil = getLockUntil();
    if (lockUntil > Date.now()) {
      const mins = Math.ceil((lockUntil - Date.now()) / 60000);
      showAlertBox('loginLock', 'loginLockText', `Locked. Try again in ${mins} min.`);
    }
  }
  loadSettings();
});
